{% extends "base.html" %}

{% block content %}

<div style="text-align: center; color: black">
  <b> <h1>Top 10 Longest Articles </h1></b>
</div>

<!-- Styles -->
<style>
#chartdivLongest {
  width: 100%;
  height: 500px;
}
</style>

<!-- Resources -->
<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

<!-- Chart code for Longest Articles -->
<script>
am5.ready(function() {

  // Create root element
  var root = am5.Root.new("chartdivLongest");

  // Set themes
  root.setThemes([am5themes_Animated.new(root)]);

  // Create chart
  var chart = root.container.children.push(am5xy.XYChart.new(root, {
    panX: false,
    panY: false,
    wheelX: "none",
    wheelY: "none",
    paddingLeft: 0
  }));

  chart.zoomOutButton.set("forceHidden", true);

  // Create axes
  var yRenderer = am5xy.AxisRendererY.new(root, {
    minGridDistance: 30,
    minorGridEnabled: true
  });
  yRenderer.grid.template.set("location", 1);

  var yAxis = chart.yAxes.push(am5xy.CategoryAxis.new(root, {
    maxDeviation: 0,
    categoryField: "title",
    renderer: yRenderer,
    tooltip: am5.Tooltip.new(root, { themeTags: ["axis"] })
  }));

  var xAxis = chart.xAxes.push(am5xy.ValueAxis.new(root, {
    maxDeviation: 0,
    min: 0,
    extraMax: 0.1,
    renderer: am5xy.AxisRendererX.new(root, { strokeOpacity: 0.1, minGridDistance: 80 })
  }));

  // Add series
  var series = chart.series.push(am5xy.ColumnSeries.new(root, {
    name: "Longest Articles",
    xAxis: xAxis,
    yAxis: yAxis,
    valueXField: "word_count",
    categoryYField: "title",
    tooltip: am5.Tooltip.new(root, { pointerOrientation: "left", labelText: "{valueX} words" })
  }));

  series.columns.template.setAll({
    cornerRadiusTR: 5,
    cornerRadiusBR: 5,
    strokeOpacity: 0
  });

  // Fetch data from your Flask API for Longest Articles
  fetch('/longest_articles')
    .then(response => response.json())
    .then(data => {
      // Prepare the data in a format amCharts expects
      const chartData = data.map(item => ({
        title: item.title || "Unknown Title", // Handle cases where the title field might be missing
        word_count: item.word_count
      }));

      // Set the data for the chart
      yAxis.data.setAll(chartData);
      series.data.setAll(chartData);
      sortCategoryAxis();
    })
    .catch(error => {
      console.error("Error fetching data:", error);
    });

  function sortCategoryAxis() {
    series.dataItems.sort(function (x, y) {
      return x.get("valueX") - y.get("valueX");
    });

    am5.array.each(yAxis.dataItems, function (dataItem) {
      var seriesDataItem = getSeriesItem(dataItem.get("category"));
      if (seriesDataItem) {
        var index = series.dataItems.indexOf(seriesDataItem);
        var deltaPosition = (index - dataItem.get("index", 0)) / series.dataItems.length;
        dataItem.set("index", index);
        dataItem.set("deltaPosition", -deltaPosition;
        dataItem.animate({
          key: "deltaPosition",
          to: 0,
          duration: 1000,
          easing: am5.ease.out(am5.ease.cubic)
        });
      }
    });

    yAxis.dataItems.sort(function (x, y) {
      return x.get("index") - y.get("index");
    });
  }

  function getSeriesItem(category) {
    for (var i = 0; i < series.dataItems.length; i++) {
      var dataItem = series.dataItems[i];
      if (dataItem.get("categoryY") == category) {
        return dataItem;
      }
    }
  }

  // Make the chart animate on load
  series.appear(1000);
  chart.appear(1000, 100);

}); // end am5.ready()
</script>

<!-- HTML -->
<div id="chartdivLongest"></div>
 {% endblock %}
