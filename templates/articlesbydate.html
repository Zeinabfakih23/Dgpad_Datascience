<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles by Date</title>

    <!-- Include amCharts libraries -->
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

    <!-- Add your custom CSS or bootstrap here -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        #chartdiv {
            width: 100%;
            height: 500px;
        }

        body {
            background-color: #f8f9fa;
        }
        nav {
            background-color: #00CED1; /* Turquoise color */
        }
        nav .nav-link {
            color: white !important; /* White text for links */
        }
        nav .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.2); /* Slight hover effect */
        }
        .container {
            margin-top: 20px;
        }
        h1 {
            color: #343a40; /* Dark color for headings */
        }
        .btn-custom {
            background-color: #00CED1; /* Button color matching navbar */
            color: white;
        }
        .btn-custom:hover {
            background-color: #00B2A9; /* Slightly darker on hover */
        }
    </style>

</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Charts Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/wordcloud">Top Keywords</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/barchart">Top Authors</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/piechart">Top Languages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/articlesbydate">Articles by Date</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/articlesbywordcount">Articles by Word Count</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/articlesbyclasses">Articles by Classes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/articlesbykeyword">Articles by Keyword</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/longestarticles">Longest Articles</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/shortestarticles">Shortest Articles</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="/articlesbykeywordcount">Articles by Specific Keyword Count</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <div class="container mt-4">
        <h1>Articles Published Over Time</h1>
        <div id="chartdiv"></div>

        <!-- Chart code -->
        <script>
            am5.ready(function() {
                var root = am5.Root.new("chartdiv");
                root.setThemes([am5themes_Animated.new(root)]);
                var chart = root.container.children.push(am5xy.XYChart.new(root, {
                    panX: true,
                    panY: true,
                    wheelX: "panX",
                    wheelY: "zoomX",
                    pinchZoomX: true,
                    paddingLeft: 0
                }));
                var cursor = chart.set("cursor", am5xy.XYCursor.new(root, {}));
                cursor.lineX.set("forceHidden", true);
                cursor.lineY.set("forceHidden", true);

                var date = new Date();
                date.setHours(0, 0, 0, 0);
                var value = 100;

                function generateData() {
                    value = Math.round((Math.random() * 10 - 5) + value);
                    am5.time.add(date, "day", 1);
                    return {
                        date: date.getTime(),
                        value: value
                    };
                }

                function generateDatas(count) {
                    var data = [];
                    for (var i = 0; i < count; ++i) {
                        data.push(generateData());
                    }
                    return data;
                }

                var xAxis = chart.xAxes.push(am5xy.DateAxis.new(root, {
                    baseInterval: {
                        timeUnit: "day",
                        count: 1
                    },
                    renderer: am5xy.AxisRendererX.new(root, {
                        minorGridEnabled: true,
                        minGridDistance: 80
                    })
                }));

                var yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
                    renderer: am5xy.AxisRendererY.new(root, {})
                }));

                var series = chart.series.push(am5xy.LineSeries.new(root, {
                    name: "Articles",
                    xAxis: xAxis,
                    yAxis: yAxis,
                    valueYField: "value",
                    valueXField: "date",
                    tooltip: am5.Tooltip.new(root, {
                        labelText: "{valueY}"
                    })
                }));

                series.fills.template.setAll({
                    fillOpacity: 0.2,
                    visible: true
                });

                var data = generateDatas(1200);
                series.data.setAll(data);

                chart.set("scrollbarX", am5.Scrollbar.new(root, {
                    orientation: "horizontal"
                }));

                series.appear(1000);
                chart.appear(1000, 100);
            }); // end am5.ready()
        </script>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
