<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles by Classes</title>

    <!-- amCharts Resources -->
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

    <style>
        #chartdiv {
            width: 100%;
            height: 500px;
        }
        body {
            background-color: #f8f9fa; /* Light background color */
        }
        h1 {
            color: #343a40; /* Dark color for headings */
            margin-top: 20px; /* Add margin for spacing */
        }
        .navbar-brand {
            color: #343a40; /* Dark color for the navbar brand */
        }
        .navbar-brand:hover {
            color: #0056b3; /* Optional: Change color on hover */
        }
        .nav-link {
            color: white !important; /* Set nav link color to white */
        }
        .nav-link:hover {
            color: #ffcc00; /* Optional: Change color on hover */
        }
        .navbar {
            background-color: #00CED1; /* Turquoise color for navbar */
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Charts Dashboard</a> <!-- Dark color for the brand -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/wordcloud">Top Keywords</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/barchart">Top Authors</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/piechart">Top Languages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/articlesbydate">Articles by Date</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/articlesbywordcount">Articles by Word Count</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/articlesbyclasses">Articles by Classes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/articlesbykeyword">Articles by Keyword</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/longestarticles">Longest Articles</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/shortestarticles">Shortest Articles</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/articlesbykeywordcount">Articles by Specific Keyword Count</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <div class="container mt-4">
        <h1>Articles by Classes</h1>
        <div id="chartdiv"></div>

        <script>
            am5.ready(function() {
                var root = am5.Root.new("chartdiv");
                root.setThemes([am5themes_Animated.new(root)]);

                var chart = root.container.children.push(am5xy.XYChart.new(root, {}));
                var yAxis = chart.yAxes.push(am5xy.CategoryAxis.new(root, {
                    categoryField: "class",
                    renderer: am5xy.AxisRendererY.new(root, {})
                }));
                var xAxis = chart.xAxes.push(am5xy.ValueAxis.new(root, {
                    renderer: am5xy.AxisRendererX.new(root, {})
                }));

                var series = chart.series.push(am5xy.ColumnSeries.new(root, {
                    xAxis: xAxis,
                    yAxis: yAxis,
                    valueXField: "count",
                    categoryYField: "class"
                }));

                fetch('/articles_by_classes')
                    .then(response => response.json())
                    .then(data => {
                        yAxis.data.setAll(data);
                        series.data.setAll(data);
                    })
                    .catch(error => console.error("Error loading data:", error));

                chart.appear(1000, 100);
            });
        </script>
    </div>
</body>

</html>
