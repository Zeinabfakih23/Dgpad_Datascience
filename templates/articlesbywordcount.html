<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles by Word Count</title>

    <!-- amCharts Resources -->
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

    <style>
        #chartdiv {
            width: 100%;
            height: 500px;
        }
        body {
            background-color: #f8f9fa; /* Light background color */
        }
        h1 {
            color: #343a40; /* Dark color for headings */
            margin-top: 20px; /* Add margin for spacing */
        }
        .navbar-brand {
            color: black; /* Set the navbar brand text color to black */
        }
        .navbar-brand:hover {
            color: #0056b3; /* Optional: Change color on hover */
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg" style="background-color: #00CED1;"> <!-- Turquoise color -->
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Charts Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/wordcloud">Top Keywords</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/barchart">Top Authors</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/piechart">Top Languages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/articlesbydate">Articles by Date</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/articlesbywordcount">Articles by Word Count</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/articlesbyclasses">Articles by Classes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/articlesbykeyword">Articles by Keyword</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white" href="/articlesbykeywordcount">Articles by Specific Keyword Count</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <div class="container mt-4">
        <h1>Articles by Word Count</h1>
        <div id="chartdiv"></div>

        <!-- Chart code -->
        <script>
            am5.ready(function() {
                // Create root element
                var root = am5.Root.new("chartdiv");

                // Set theme
                root.setThemes([am5themes_Animated.new(root)]);

                // Create chart
                var chart = root.container.children.push(am5xy.XYChart.new(root, {
                    panX: true,
                    panY: true,
                    wheelX: "panX",
                    wheelY: "zoomX"
                }));

                // Create axes
                var xAxis = chart.xAxes.push(am5xy.ValueAxis.new(root, {
                    renderer: am5xy.AxisRendererX.new(root, {}),
                    title: am5.Label.new(root, { text: "Word Count" })
                }));

                var yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
                    renderer: am5xy.AxisRendererY.new(root, {}),
                    title: am5.Label.new(root, { text: "Article Count" })
                }));

                // Create series
                var series = chart.series.push(am5xy.ColumnSeries.new(root, {
                    name: "Articles",
                    xAxis: xAxis,
                    yAxis: yAxis,
                    valueYField: "article_count",
                    valueXField: "word_count",
                    tooltip: am5.Tooltip.new(root, {
                        labelText: "{valueY}"
                    })
                }));

                // Increase the width of the columns
                series.columns.template.setAll({
                    tooltipText: "{valueX}: {valueY}",
                    width: am5.percent(90),  // Adjust column width to be 90% of the available space
                    fillOpacity: 0.8
                });

                // Load data from the API
                fetch("/articles_by_word_count")
                    .then(response => response.json())
                    .then(data => {
                        series.data.setAll(data);
                        chart.appear(1000, 100);
                    })
                    .catch(error => {
                        console.error("Error loading chart data:", error);
                    });
            });
        </script>
    </div>
</body>
</html>
