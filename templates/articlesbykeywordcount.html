<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles by Specific Keyword Count</title>

    <!-- Include amCharts libraries -->
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/percent.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <style>
        #chartdiv {
            width: 100%;
            height: 500px;
        }
        .navbar {
            background-color: #00CED1;
        }
        .navbar .nav-link {
            color: white;
        }
        .navbar .nav-link.active {
            background-color: transparent;
        }
        .navbar .nav-link:hover {
            color: #f0f0f0;
        }
        .navbar .navbar-brand {
            color: white;
            background-color: #00CED1;
            padding: 8px;
            border-radius: 5px;
        }
        .btn-custom {
            background-color: #00CED1;
            color: white;
            border: none;
        }
        .btn-custom:hover {
            background-color: #00b7bd;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Charts Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/wordcloud">Top Keywords</a></li>
                    <li class="nav-item"><a class="nav-link" href="/barchart">Top Authors</a></li>
                    <li class="nav-item"><a class="nav-link" href="/piechart">Top Languages</a></li>
                    <li class="nav-item"><a class="nav-link" href="/articlesbydate">Articles by Date</a></li>
                    <li class="nav-item"><a class="nav-link" href="/articlesbywordcount">Articles by Word Count</a></li>
                    <li class="nav-item"><a class="nav-link" href="/articlesbyclasses">Articles by Classes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/articlesbykeyword">Articles by Keyword</a></li>
                    <li class="nav-item"><a class="nav-link" href="/longestarticles">Longest Articles</a></li>
                    <li class="nav-item"><a class="nav-link" href="/shortestarticles">Shortest Articles</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/articlesbykeywordcount">Articles by Specific Keyword Count</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="text-center">Articles by Specific Keyword Count</h1>

        <!-- Input field for keyword count -->
        <div class="text-center mb-3">
            <label for="keywordCountInput" class="form-label">Enter Keyword Count:</label>
            <input type="number" id="keywordCountInput" class="form-control" style="width: 200px; margin: 0 auto;" placeholder="e.g., 3">
            <button class="btn btn-custom mt-3" onclick="fetchAndDisplayChart()">Show Articles</button>
        </div>

        <div id="chartdiv"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart code -->
    <script>
        function fetchAndDisplayChart() {
            const count = document.getElementById('keywordCountInput').value;

            if (!count || count < 1) {
                alert("Please enter a valid keyword count.");
                return;
            }

            fetch(`/articles_with_specific_keyword_count/${count}`)
                .then(response => response.json())
                .then(data => {
                    if (data.length === 0) {
                        alert(`No articles found with exactly ${count} keywords.`);
                        return;
                    }

                    if (window.am5Root) {
                        window.am5Root.dispose();
                    }

                    const root = am5.Root.new("chartdiv");
                    window.am5Root = root;

                    root.setThemes([am5themes_Animated.new(root)]);

                    const chart = root.container.children.push(am5percent.PieChart.new(root, {
                        layout: root.horizontalLayout
                    }));

                    const series = chart.series.push(am5percent.PieSeries.new(root, {
                        valueField: "value",
                        categoryField: "title",
                        alignLabels: true
                    }));

                    series.labels.template.setAll({
                        text: "{category}",
                        fontSize: 15,
                        radius: 10
                    });

                    series.slices.template.setAll({
                        tooltipText: "{category}: [bold]{value}[/]",
                        stroke: am5.color(0xFFFFFF),
                        strokeWidth: 2,
                        strokeOpacity: 0.7
                    });

                    const chartData = data.map(item => ({
                        title: item.title || "Unknown Title",
                        value: 1
                    }));

                    series.data.setAll(chartData);
                    chart.appear(1000, 100);
                })
                .catch(error => {
                    console.error("Error fetching data:", error);
                });
        }
    </script>

</body>
</html>
